name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please **never paste your GitHub token**.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran (remove any token).
      render: shell
      placeholder: retrocommit --from 2024-01-01 --commits 1-5
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output, ideally with `--verbose`.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of `retrocommit doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: retrocommit version
      description: Output of `retrocommit --version`
      placeholder: 1.0.0
    validations:
      required: true
